<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tavlan</title>
<style>
:root{--bg:#f6f4f1;--ink:#14232d;--muted:#91a3af;--line:#ddd8d1;--teal:#24859a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}.app{max-width:850px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;padding:14px 0 24px;border-bottom:1px solid var(--line)}h1{font-size:34px}.tabs,.chips,.filters{display:flex;gap:9px;overflow:auto;padding:10px 0}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 16px;font-weight:750;color:#617481}.active{background:var(--ink)!important;color:#fff!important}.dot{display:inline-block;width:6px;height:23px;border-radius:4px;margin-right:8px;vertical-align:middle}.summary{display:flex;gap:14px;align-items:baseline}.summary h2{font-size:29px}.muted,.meta{color:var(--muted)}.add{display:grid;grid-template-columns:1fr 170px 135px;gap:9px}input,select,textarea{font:inherit;border:1px solid #d4cec6;background:#fff;border-radius:14px;padding:14px}.primary{border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:800}.search{width:100%;margin:12px 0}.group{margin-top:25px}.grouphead{font-weight:800;color:#617481}.task,.match{background:#fff;border:1px solid var(--line);border-radius:17px;margin:9px 0}.taskrow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;padding:17px}.check{width:26px;height:26px;border:2px solid #d6d0c8;border-radius:8px;background:#fff}.title{font-weight:800;font-size:19px}.meta{font-size:13px;margin-top:5px}.prio{border:2px solid #2d6292;color:#2d6292;border-radius:9px;padding:6px 9px;font-weight:800}.prio.Hög{background:#c77b08;border-color:#c77b08;color:#fff}.prio.Akut{background:#c6372b;border-color:#c6372b;color:#fff}.details{display:none;border-top:1px solid var(--line);padding:18px}.task.open .details{display:block}.seg{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.seg button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px}.seg .sel{background:var(--ink);color:#fff}.label{color:var(--muted);font-weight:650;margin-top:12px}textarea{width:100%;min-height:90px}.hidden{display:none!important}.weeknav{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.weeknav button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}.match{display:grid;grid-template-columns:68px 1fr auto;gap:10px;padding:16px;align-items:center}.tag{font-size:12px;background:#edf2e9;color:#557f31;border-radius:999px;padding:5px 8px;font-weight:800}.error{background:#fff3f0;border:1px solid #e6b8ad;border-radius:14px;padding:15px}
@media(max-width:650px){.app{padding:14px}.add{grid-template-columns:1fr 1fr}.add input{grid-column:1/-1}.primary{min-height:54px}.match{grid-template-columns:58px 1fr}.tag{grid-column:2}}
</style></head><body><main class="app"><div class="top"><b>⌂ &nbsp; Tavlan</b><span class="muted" id="sync">● Ansluter…</span></div><h1>Tavlan <small class="muted" style="font-size:16px">internt</small></h1><div class="tabs"><button id="taskTab" class="pill active" onclick="setView('tasks')">Aktiviteter</button><button id="matchTab" class="pill" onclick="setView('matches')">Veckans matcher</button></div>
<section id="taskView"><div id="areas" class="chips"></div><div class="summary"><h2 id="heading">Allt</h2><span id="stats" class="muted"></span></div><div class="add"><input id="newTitle" placeholder="Vad ska göras?"><select id="newPrio"><option>Låg</option><option selected>Normal</option><option>Hög</option><option>Akut</option></select><button class="primary" onclick="addTask()">Lägg till</button></div><div id="filters" class="filters"></div><input id="search" class="search" placeholder="Sök"><div id="list"><p class="muted">Hämtar aktiviteter…</p></div></section>
<section id="matchView" class="hidden"><div class="weeknav"><button onclick="shiftWeek(-7)">←</button><strong id="weekLabel"></strong><button onclick="shiftWeek(7)">→</button></div><div id="matchList"><p class="muted">Hämtar matcher…</p></div></section></main>
<script>
const SB='https://zcxqunsdaqwrpbkvkdxb.supabase.co',KEY='sb_publishable_eMCwcca4Om6-d6ZjaG82Yw_vWM3Kj5p';
const HDR={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const A={all:['Allt','#91a3af'],jo:['JO Creative','#24859a'],own:['Ownfield','#c75d43'],ov:['OV','#557f31'],priv:['Privat','#7650a5']},S=['Att göra','Pågår','Väntar','Klar'],P=['Låg','Normal','Hög','Akut'];let tasks=[],matches=[],area='all',filter='Öppna',q='',week=0;
async function api(path,opt={}){let r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{...HDR,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):[]}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{[tasks,matches]=await Promise.all([api('tasks?select=*&order=created_at.desc'),api('matches?select=*&order=match_date.asc,match_time.asc')]);sync.textContent='● Synkad';render();renderMatches()}catch(e){sync.textContent='● Fel';list.innerHTML='<div class=error>Kunde inte läsa Supabase: '+esc(e.message)+'</div>';console.error(e)}}
function setView(v){taskView.classList.toggle('hidden',v!='tasks');matchView.classList.toggle('hidden',v!='matches');taskTab.classList.toggle('active',v=='tasks');matchTab.classList.toggle('active',v=='matches')}
function setArea(x){area=x;render()}function setFilter(x){filter=x;render()}
async function upd(id,k,v){try{await api('tasks?id=eq.'+id,{method:'PATCH',body:JSON.stringify({[k]:v,updated_at:new Date().toISOString()})});tasks.find(x=>x.id==id)[k]=v;render()}catch(e){alert('Kunde inte spara: '+e.message)}}
async function addTask(){let v=newTitle.value.trim();if(!v)return;try{let r=await api('tasks',{method:'POST',body:JSON.stringify({title:v,area:area=='all'?'ov':area,status:'Att göra',priority:newPrio.value,source:'Manuell'})});tasks.unshift(r[0]);newTitle.value='';render()}catch(e){alert('Kunde inte lägga till: '+e.message)}}
function visible(t){if(area!='all'&&t.area!=area)return false;if(q&&!((t.title+' '+(t.notes||'')).toLowerCase().includes(q.toLowerCase())))return false;if(filter=='Öppna')return t.status!='Klar';if(filter=='Alla')return true;return t.status==filter}
function card(t){return '<article class="task"><div class="taskrow" onclick="if(!event.target.closest(\\'button,input,textarea\\'))this.parentNode.classList.toggle(\\'open\\')"><button class=check onclick="upd(\\''+t.id+'\\',\\'status\\',\\''+(t.status=='Klar'?'Att göra':'Klar')+'\\')">'+(t.status=='Klar'?'✓':'')+'</button><div><div class=title>'+esc(t.title)+'</div><div class=meta>'+esc(A[t.area]?.[0]||t.area)+' · '+esc(t.source)+(t.due?' · '+t.due:'')+'</div></div><span class="prio '+esc(t.priority)+'">'+esc(t.priority)+'</span></div><div class=details><div class=label>Status</div><div class=seg>'+S.map(x=>'<button class="'+(t.status==x?'sel':'')+'" onclick="upd(\\''+t.id+'\\',\\'status\\',\\''+x+'\\')">'+x+'</button>').join('')+'</div><div class=label>Prioritet</div><div class=seg>'+P.map(x=>'<button class="'+(t.priority==x?'sel':'')+'" onclick="upd(\\''+t.id+'\\',\\'priority\\',\\''+x+'\\')">'+x+'</button>').join('')+'</div><div class=label>Klart senast</div><input type=date value="'+(t.due||'')+'" onchange="upd(\\''+t.id+'\\',\\'due\\',this.value||null)"><div class=label>Anteckning</div><textarea onchange="upd(\\''+t.id+'\\',\\'notes\\',this.value)">'+esc(t.notes||'')+'</textarea></div></article>'}
function render(){areas.innerHTML=Object.entries(A).map(([k,v])=>'<button class="pill '+(area==k?'active':'')+'" onclick="setArea(\\''+k+'\\')"><i class=dot style="background:'+v[1]+'"></i>'+v[0]+' '+tasks.filter(t=>(k=='all'||t.area==k)&&t.status!='Klar').length+'</button>').join('');heading.textContent=A[area][0];let b=tasks.filter(t=>area=='all'||t.area==area);stats.textContent=b.filter(t=>t.status!='Klar').length+' öppna · '+b.filter(t=>t.status=='Pågår').length+' pågår · '+b.filter(t=>t.status=='Väntar').length+' väntar';filters.innerHTML=['Öppna','Att göra','Pågår','Väntar','Klar','Alla'].map(x=>'<button class="pill '+(filter==x?'active':'')+'" onclick="setFilter(\\''+x+'\\')">'+x+'</button>').join('');let a=tasks.filter(visible),gs=area=='all'?['jo','own','ov','priv']:[area];list.innerHTML=gs.map(g=>{let z=a.filter(t=>t.area==g);return z.length?'<section class=group><div class=grouphead><i class=dot style="background:'+A[g][1]+'"></i>'+A[g][0]+' '+z.length+'</div>'+z.map(card).join('')+'</section>':''}).join('')||'<p class=muted>Inga aktiviteter här.</p>'}
function monday(d){let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(12);return x}function iso(d){return d.toISOString().slice(0,10)}
function renderMatches(){let b=monday(new Date());b.setDate(b.getDate()+week);let e=new Date(b);e.setDate(e.getDate()+6);weekLabel.textContent=b.toLocaleDateString('sv-SE',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('sv-SE',{day:'numeric',month:'short',year:'numeric'});let a=matches.filter(m=>m.match_date>=iso(b)&&m.match_date<=iso(e)),g={};a.forEach(m=>(g[m.match_date]??=[]).push(m));matchList.innerHTML=Object.entries(g).map(([d,ms])=>'<section class=group><div class=grouphead>'+new Date(d+'T12:00').toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})+'</div>'+ms.map(m=>'<div class=match><b>'+(m.match_time||'').slice(0,5)+'</b><div><strong>'+(m.home?esc(m.team):esc(m.opponent))+' – '+(m.home?esc(m.opponent):esc(m.team))+'</strong><div class=meta>'+esc(m.competition)+' · '+(m.home?'Hemma':'Borta')+'</div></div><span class=tag>'+esc(m.team)+'</span></div>').join('')+'</section>').join('')||'<p class=muted>Inga matcher denna vecka.</p>'}
function shiftWeek(n){week+=n;renderMatches()}search.oninput=e=>{q=e.target.value;render()};load();
</script></body></html>
